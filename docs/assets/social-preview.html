<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;width:1280px;height:640px;background:#0f1115;color:#e8eaef;
    font-family:-apple-system,"SF Pro Display","Segoe UI",Roboto,sans-serif;overflow:hidden}
  .wrap{padding:72px 80px;height:100%;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between}
  h1{font-size:92px;margin:0;letter-spacing:-.03em}
  p{font-size:34px;color:#9aa2b1;margin:16px 0 0;max-width:1000px;line-height:1.3}
  .bar{height:46px;border-radius:10px;background:#171a21;border:2px solid #2a2f3a;position:relative;overflow:hidden}

  .u{left:0;width:36%;background:#545c6c}.n{left:36%;width:52%;background:#ff7a6b}
  .l{left:71%;width:4px;background:#e8eaef}

  .tag{font-size:24px;color:#8b97ff}
</style></head><body><div class="wrap">
  <div><h1>Will it load? 🧮</h1>
  <p>Why LM Studio says <span style="color:#ff7a6b">“insufficient system resources”</span>, and how much room you really have.</p></div>
  <div><div class="bar"><span class="u"></span><span class="n"></span><span class="l"></span></div>
  <div class="row"><span>loaded 11.9 GiB</span><span>+ new model 19.7 GiB</span><span>budget 25.6 GiB</span></div></div>
  <div class="tag">github.com/nikpottbecker/will-it-load · unofficial · open source</div>
</div></body></html>
