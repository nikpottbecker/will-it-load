name: Bug or wrong prediction
description: will-it-load crashed or predicted the wrong result
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Command and output
      render: text
  - type: input
    id: env
    attributes:
      label: OS, RAM, LM Studio version
